<!DOCTYPE html>
<html class="light" lang="en">

<head>

    <meta charset="utf-8" />

    <title>Yoga Sutra Viewer - Light of Yoga</title>

    <!-- Fonts -->

        rel="stylesheet" />

    <link rel="icon" type="image/png" href="favicon.png">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37", // Champagne Gold
                        "primary-dark": "#C5A059",
                        "primary-light": "#ebd59b",
                        "background-light": "#FAFAFA", // Pristine off-white
                        "background-dark": "#161618", // Rich onyx/charcoal
                        "parchment": "#F7F5F0",
                        "parchment-dark": "#1C1C1E",
                        "ink": "#161618"
                    },
                    fontFamily: {
                        "display": ["Cinzel", "serif"],
                        "serif": ["Cormorant Garamond", "serif"],
                        "kr-serif": ["Maru Buri", "Noto Serif KR", "serif"],
                        "sans": ["Inter", "sans-serif"],

                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    boxShadow: {
                        'gold-glow': '0 0 30px -10px rgba(212, 175, 55, 0.4)',
                        'gold-glow-lg': '0 0 50px -15px rgba(212, 175, 55, 0.5)',
                    }
                },
            },
        }
    </script>
    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
            -webkit-overflow-scrolling: touch;
            /* Smooth scrolling on iOS */
            overscroll-behavior: contain;
            /* Prevent body scroll chaining */
        }

        /* Auto-resize textarea */
        textarea {
            field-sizing: content;
        }
    </style>
    <link rel="stylesheet" href="styles.css?v=2">
    <style>
        /* Readability Optimizations */
        .lang-ko {
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            letter-spacing: -0.01em;
            line-height: 1.8;
            word-break: keep-all;
        }

        .lang-en {
            font-family: "Cormorant Garamond", "Noto Serif", serif;
            letter-spacing: 0;
            line-height: 1.75;
        }

        .section-label {
            font-size: 13px;
            letter-spacing: 0.1em;
            font-weight: 600;
            color: #D4AF37;
            /* Gold accent */
            opacity: 0.8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .content-block {
            padding-left: 12px;
            border-left: 2px solid rgba(212, 175, 55, 0.2);
        }

        /* Dark mode overrides */
        .dark .section-label {
            color: #ebd59b;
        }

        .dark .content-block {
            border-left-color: rgba(212, 175, 55, 0.3);
        }

        .glass-panel {
            background: rgba(250, 250, 250, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .dark .glass-panel {
            background: rgba(22, 22, 24, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

</head>

<body
    class="bg-background-light dark:bg-background-dark text-ink dark:text-gray-100 min-h-screen font-display transition-opacity duration-700 overflow-hidden opacity-0"
    style="opacity: 0;">
    <script>
        document.fonts.ready.then(function () {
            requestAnimationFrame(function () {
                document.body.style.opacity = '1';
                document.body.classList.remove('opacity-0');
            });
        });
    </script>

    <!-- 비밀번호 게이트 오버레이 -->
    <div id="password-gate"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-background-light dark:bg-background-dark transition-opacity duration-700">
        <div class="w-full max-w-md p-8 text-center space-y-8">
            <div class="flex flex-col items-center gap-4">
                <div class="size-16 rounded-full bg-primary/10 flex items-center justify-center text-primary-dark">
                    <span class="material-symbols-outlined text-4xl">lock</span>
                </div>
                <div>
                    <h2 class="text-2xl font-serif text-primary-dark font-bold italic tracking-tight">Access Restricted
                    </h2>
                    <p class="text-[10px] text-text-muted font-display tracking-[0.2em] uppercase mt-1">Light of Yoga
                    </p>
                </div>
            </div>

            <form id="password-form" class="space-y-6" onsubmit="checkPassword(event)">
                <div class="relative group">
                    <input type="password" id="app-password" placeholder="Enter Password"
                        class="w-full bg-white/50 backdrop-blur-sm border 1px solid rgba(212, 175, 55, 0.2) rounded-xl px-4 py-4 text-center text-xl tracking-[0.5em] focus:ring-4 focus:ring-primary/10 focus:border-primary/50 outline-none transition-all placeholder:tracking-widest placeholder:text-sm placeholder:text-text-muted/60 font-serif"
                        autofocus autocomplete="off">
                    <div id="password-error"
                        class="hidden absolute -bottom-6 left-0 right-0 text-[10px] text-red-500 font-bold uppercase tracking-wider">
                        잘못된 비밀번호임.
                    </div>
                </div>
                <button type="submit"
                    class="w-full bg-ink text-primary-light hover:text-white font-medium py-4 rounded-xl shadow-[0_4px_15px_-3px_rgba(212,175,55,0.2)] hover:shadow-gold-glow transition-all active:scale-[0.98] font-sans flex items-center justify-center gap-3 uppercase tracking-[0.2em] text-sm border border-primary/20 hover:border-primary/50">
                    Enter Gateway
                    <span class="material-symbols-outlined text-xl">vaping_rooms</span>
                </button>
            </form>

            <div class="pt-2">
                <p class="text-xs text-text-muted mt-4 font-serif italic opacity-70">
                    문의 : <a href="mailto:roadsea@naver.com"
                        class="text-primary-dark hover:underline">roadsea@naver.com</a>
                </p>
            </div>

            <p class="text-[9px] text-text-muted/40 uppercase tracking-[0.2em] font-display">
                Dedicated to the timeless wisdom of Patanjali
            </p>
        </div>
    </div>
    <script>
        (function () {
            try {
                var p = '0228';
                var l = localStorage.getItem('yoga_gate_auth');
                var c = document.cookie.split('; ').find(function (r) { return r.trim().startsWith('yoga_gate_auth=') });
                var cv = c ? c.split('=')[1] : null;
                if (l === p || cv === p) {
                    var g = document.getElementById('password-gate');
                    if (g) { g.style.display = 'none'; g.classList.add('hidden'); }
                    document.body.classList.remove('overflow-hidden');
                    var ctt = document.getElementById('app-wrapper') || document.getElementById('main-content') || document.getElementById('landing-page');
                    if (ctt) { ctt.classList.remove('invisible'); ctt.classList.add('opacity-100'); }
                }
            } catch (e) { }
        })();
    </script>

    <div id="app-wrapper" class="transition-all duration-700 flex flex-col h-[100dvh] overflow-hidden">
        <!-- 상단 내비게이션 -->
        <header
            class="h-20 border-b border-primary/10 glass-panel flex items-center justify-between px-6 md:px-10 shrink-0 z-30 shadow-sm relative">
            <div class="flex items-center gap-3 md:gap-6">
                <!-- 모바일 메뉴 토글 -->
                <button
                    class="lg:hidden p-2 text-primary hover:bg-primary/5 rounded-lg transition-colors border border-transparent hover:border-primary/20"
                    onclick="toggleSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity"
                    title="Back to Home">
                    <span class="material-symbols-outlined text-primary text-2xl drop-shadow-sm">spa</span>
                    <h1
                        class="text-lg md:text-xl font-medium tracking-widest text-ink dark:text-gray-100 font-display uppercase whitespace-nowrap">
                        Yoga Sutras</h1>
                </a>
            </div>
            <div class="flex items-center gap-1.5 md:gap-6">
                <!-- 빠른 탐색 (모바일 숨김, 데스크탑 표시) -->
                <div
                    class="hidden md:flex items-center gap-2 md:gap-4 bg-white/40 dark:bg-ink/40 backdrop-blur-sm rounded-xl py-1 px-3 md:px-5 border border-primary/20 shadow-inner">
                    <div class="relative">
                        <select id="chapter-select-header"
                            class="bg-transparent border-none text-[11px] md:text-sm p-0 pr-4 md:pr-7 focus:ring-0 text-ink dark:text-gray-200 cursor-pointer font-serif appearance-none font-medium outline-none w-10 md:w-auto">
                            <option value="1" class="bg-[#fdfbf7] dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                                1장
                            </option>
                            <option value="2" class="bg-[#fdfbf7] dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                                2장</option>
                            <option value="3" class="bg-[#fdfbf7] dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                                3장</option>
                            <option value="4" class="bg-[#fdfbf7] dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                                4장</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none text-[10px] md:text-xs">arrow_drop_down</span>
                    </div>
                    <div class="w-px h-4 bg-primary/30 mx-2"></div>
                    <div class="relative">
                        <select id="sutra-select-header"
                            class="bg-transparent border-none text-[11px] md:text-sm p-0 pr-4 focus:ring-0 text-ink dark:text-gray-200 cursor-pointer font-serif w-10 md:w-20 appearance-none font-medium outline-none">
                            <!-- JS로 동적 생성됨 -->
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-primary/50 pointer-events-none text-[10px] md:text-xs">arrow_drop_down</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button
                        class="xl:hidden p-2 text-primary/70 hover:text-primary hover:bg-primary/10 rounded-xl transition-colors border border-transparent hover:border-primary/20"
                        onclick="toggleNotes()" title="User Notes">
                        <span class="material-symbols-outlined text-[20px]">edit_note</span>
                    </button>
                    <button
                        class="p-2 text-primary/70 hover:text-primary hover:bg-primary/10 rounded-xl transition-colors border border-transparent hover:border-primary/20"
                        onclick="toggleTheme()" title="Toggle Theme">
                        <span class="material-symbols-outlined text-[20px]">dark_mode</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 모바일 둥둥 떠있는 하단 내비게이션 바 -->
        <div class="md:hidden fixed top-16 left-0 right-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-primary/10 px-4 py-2 flex items-center justify-center transition-transform duration-300"
            id="mobile-nav-bar">
            <div
                class="flex items-center gap-2 bg-parchment dark:bg-slate-800 rounded-lg py-1 px-4 border border-primary/10 shadow-sm w-full justify-center max-w-sm">
                <div class="relative flex-1 text-center">
                    <select id="chapter-select-mobile"
                        class="bg-transparent border-none text-xs p-0 pr-4 focus:ring-0 text-slate-700 dark:text-slate-200 cursor-pointer font-serif appearance-none font-medium outline-none w-full text-center">
                        <option value="1" class="bg-[#fdfbf7] dark:bg-slate-800">1장. 삼매장</option>
                        <option value="2" class="bg-[#fdfbf7] dark:bg-slate-800">2장. 방법장</option>
                        <option value="3" class="bg-[#fdfbf7] dark:bg-slate-800">3장. 초월지장</option>
                        <option value="4" class="bg-[#fdfbf7] dark:bg-slate-800">4장. 독존장</option>
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-primary/40 pointer-events-none text-[10px]">arrow_drop_down</span>
                </div>
                <div class="w-px h-3 bg-primary/20 mx-2"></div>
                <div class="relative flex-1 text-center">
                    <select id="sutra-select-mobile"
                        class="bg-transparent border-none text-xs p-0 pr-4 focus:ring-0 text-slate-700 dark:text-slate-200 cursor-pointer font-serif appearance-none font-medium outline-none w-full text-center">
                        <!-- JS로 동적 생성됨 -->
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-primary/40 pointer-events-none text-[10px]">arrow_drop_down</span>
                </div>
            </div>
        </div>
        <!-- 메인 작업 공간 -->
        <div class="flex flex-1 overflow-hidden relative">
            <!-- 좌측 사이드바: 내비게이션 드로어 -->
            <aside id="left-sidebar"
                class="fixed inset-y-0 left-0 w-[340px] bg-background-light dark:bg-background-dark border-r border-primary/20 z-40 transition-transform -translate-x-full lg:relative lg:translate-x-0 flex flex-col shrink-0">
                <div class="p-6 border-b border-primary/10 flex items-center justify-between">
                    <h2 class="text-xs font-bold text-primary/70 uppercase tracking-[0.2em] font-display">Chapters &amp;
                        Sutras</h2>
                    <button
                        class="lg:hidden p-2 text-primary/50 hover:text-primary transition-colors hover:bg-primary/5 rounded-full"
                        onclick="closeAllSidebars()">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                <div class="p-4 border-b border-primary/10">
                    <div class="space-y-1" id="chapter-list">
                        <!-- JS로 주입되는 챕터 버튼들 -->
                    </div>
                </div>
                <!-- 선택된 챕터의 수트라 목록 -->
                <div class="flex-1 overflow-y-auto p-2 no-scrollbar" id="sidebar-sutra-list">
                    <!-- JS로 주입되는 수트라 링크들 -->
                </div>
            </aside>

            <!-- 중앙 콘텐츠: 수트라 영역 -->
            <main class="flex-1 flex flex-col h-full overflow-hidden relative" id="main-content">
                <div class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-14 pt-20 md:pt-10 scroll-smooth"
                    id="sutra-detail-view">
                    <!-- JS로 주입되는 상세 수트라 콘텐츠 -->
                    <div
                        class="flex items-center justify-center h-full text-text-muted/50 italic font-serif text-lg tracking-wide">
                        Select a sutra to begin...
                    </div>
                </div>

                <!-- 모바일 사이드바용 오버레이 -->
                <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden transition-opacity opacity-0"
                    onclick="closeAllSidebars()"></div>

                <!-- 수트라 하단 내비게이션 (모바일/데스크탑) -->
                <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-6 glass-panel px-6 py-3 rounded-full shadow-gold-glow border border-primary/20 z-10 transition-transform duration-500"
                    id="bottom-nav">
                    <button
                        class="size-10 flex items-center justify-center rounded-full hover:bg-primary/10 text-primary-dark transition-all hover:scale-105 active:scale-95"
                        id="prev-sutra-btn">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </button>
                    <span class="text-base font-serif font-medium text-ink dark:text-gray-100 tracking-widest px-2"
                        id="current-sutra-indicator">--</span>
                    <button
                        class="size-10 flex items-center justify-center rounded-full hover:bg-primary/10 text-primary-dark transition-all hover:scale-105 active:scale-95"
                        id="next-sutra-btn">
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </div>
            </main>

            <!-- 우측 사이드바: 노트 드로어 -->
            <aside id="right-sidebar"
                class="fixed inset-y-0 right-0 w-[380px] bg-parchment dark:bg-parchment-dark border-l border-primary/20 z-40 transition-transform translate-x-full xl:relative xl:translate-x-0 flex flex-col shrink-0">
                <div class="p-6 border-b border-primary/10 flex items-center justify-between glass-panel shadow-sm">
                    <div class="flex items-center gap-3 text-ink dark:text-gray-100">
                        <span class="material-symbols-outlined text-primary text-2xl">edit_note</span>
                        <h2 class="text-base font-display tracking-widest uppercase">Reflections</h2>
                    </div>
                    <button
                        class="xl:hidden p-2 text-primary/50 hover:text-primary transition-colors hover:bg-primary/5 rounded-full"
                        onclick="closeAllSidebars()">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                <div class="flex-1 p-6 overflow-y-auto">
                    <div class="text-[10px] font-display text-primary/70 mb-3 uppercase tracking-[0.2em]"><span
                            id="note-sutra-id">...</span></div>
                    <div
                        class="bg-white/60 dark:bg-ink/60 rounded-xl shadow-inner border border-primary/15 p-2 mb-6 backdrop-blur-sm">
                        <textarea
                            class="w-full h-72 resize-none border-none focus:ring-0 text-base text-text-main dark:text-gray-300 bg-transparent p-3 leading-loose font-kr-serif placeholder:text-text-muted/40 placeholder:font-serif placeholder:italic"
                            placeholder="Write your reflections here..." id="user-note-area"></textarea>
                    </div>
                    <div class="flex justify-end gap-3 mt-4">
                        <button
                            class="bg-white/50 dark:bg-ink/50 hover:bg-white dark:hover:bg-ink text-text-muted dark:text-gray-300 border border-primary/20 hover:border-primary/50 px-4 py-2.5 rounded-xl text-sm font-serif tracking-wide shadow-sm transition-all flex items-center gap-2 backdrop-blur-sm"
                            onclick="exportNotes()" title="Download Notes as Text File">
                            <span class="material-symbols-outlined text-[18px]">download</span>
                            Export
                        </button>
                        <button
                            class="bg-ink hover:bg-background-dark text-primary-light hover:text-white px-5 py-2.5 rounded-xl text-sm font-serif tracking-wide shadow-gold-glow border border-transparent hover:border-primary/30 transition-all flex items-center gap-2"
                            onclick="saveNote()">
                            <span class="material-symbols-outlined text-[18px]">save</span>
                            Save Note
                        </button>
                    </div>
                </div>
            </aside>
        </div> <!-- 메인 콘텐츠 닫기 -->

        <!-- 데이터 및 스크립트 로드 -->
        <script src="data.js" defer></script>
        <script type="module" src="js/app.js" defer></script>
</body>

</html>
